<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Private Enquiries | Tap’d Up</title><link rel="stylesheet" href="enquiry.css"><style>.admin-toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.admin-toolbar select{width:auto}details{margin:18px 0;border:1px solid #454a56;border-radius:8px;padding:16px}summary{cursor:pointer;font-weight:bold}dt{color:#b8bcc5}dd{margin:0 0 12px;overflow-wrap:anywhere;white-space:pre-wrap}.admin-status{display:flex;gap:10px;flex-wrap:wrap}.admin-status button{padding:8px 16px;font-size:14px}</style></head><body><div class="enquiry-wrap"><header class="enquiry-header"><h1>Tap’d Up enquiries</h1><a href="index.html">Website</a></header><p>Private owner view. Enquiries do not reserve dates or confirm bookings.</p><section id="login" class="enquiry-card"><h2>Sign in</h2><form id="login-form"><label for="access-key">Calendar access key</label><input id="access-key" type="password" required minlength="24" autocomplete="current-password"><p class="enquiry-muted">Your key is kept in memory for this page session. Sign out when finished.</p><button type="submit">Open enquiries</button></form></section><section id="admin" hidden><div class="admin-toolbar"><label for="status-filter">Show</label><select id="status-filter"><option value="new">New enquiries</option><option value="contacted">Contacted</option><option value="closed">Closed</option><option value="all">All enquiries</option></select><button id="refresh" type="button">Refresh</button><button id="logout" type="button">Sign out</button></div><div id="enquiry-list"></div><button id="more" hidden type="button">Next page</button></section><p id="admin-status" role="status" aria-live="polite"></p></div><script src="admin-enquiries.js" defer></script></body></html>
